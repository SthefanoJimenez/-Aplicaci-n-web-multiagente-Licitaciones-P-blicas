name: Ingesta diaria de convocatorias

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingesta-diaria
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OCDS_USER_AGENT: ${{ vars.OCDS_USER_AGENT }}
      OCDS_MONTHS: ${{ vars.OCDS_MONTHS }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar la ingesta
        run: python ingest_job.py

      # Solo si la ingesta falla: consultas pequeñas para saber si el 403 es un mes aún no
      # publicado o un bloqueo del portal a la red de GitHub. El resultado sale en el resumen.
      - name: Diagnóstico de la API (solo si falló)
        if: failure()
        run: python ingest_job.py --diagnostico