{# Indicador de avance: el flujo tiene 5 pasos #}
<div class="avance" aria-label="Paso {{ paso }} de 5">
    <ol class="avance-barra" aria-hidden="true">
        {% for i in range(1, 6) %}<li class="{{ 'hecho' if i <= paso else '' }}"></li>{% endfor %}
    </ol>
    <p class="avance-texto">Paso {{ paso }} de 5: {{ nombre_paso }}</p>
</div>
