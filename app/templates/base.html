<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}{% endblock %} | {{ app_nombre }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body>
    <header class="cabecera">
        <div class="cabecera-interior">
            <a class="marca" href="{{ url_for('describir') }}">{{ app_nombre }}</a>
        </div>
    </header>

    <main class="contenido">
        {% block paso %}{% endblock %}
        {% block contenido %}{% endblock %}
    </main>

    <footer class="pie">
        Resultados referenciales, calculados con las adjudicaciones de bienes registradas por el OECE entre 2023 y 2025.
    </footer>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>

</html>
