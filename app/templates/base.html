<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LicitaFácil ayuda a las empresas de La Libertad a decidir si les conviene vender al Estado, con datos de adjudicaciones del OECE 2023-2025.">
  <title>{% block title %}{% endblock %} | {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <a class="skip-link" href="#contenido">Ir al contenido</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('home') }}">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="16" cy="16" r="9.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M11.5 16.5l3 3 6-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        {{ app_name }}
      </a>
      <nav class="nav" aria-label="Secciones">
        <a href="{{ url_for('describe') }}" {% if active_nav == "evaluate" %}aria-current="page"{% endif %}>Evaluar mi producto</a>
        <a href="{{ url_for('overview') }}" {% if active_nav == "overview" %}aria-current="page"{% endif %}>Panorama del mercado</a>
        <a href="{{ url_for('data_preparation') }}" {% if active_nav == "data" %}aria-current="page"{% endif %}>Cómo preparamos los datos</a>
        <button type="button" class="nav-help" data-tour-start title="Recorrido guiado" aria-label="Ver recorrido guiado">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2M12 17h.01"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="contenido" class="page {% block page_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>Resultados referenciales calculados con las adjudicaciones de bienes registradas por el OECE entre 2023 y 2025.</span>
      <span>© 2026 LicitaFácil. Todos los derechos reservados.</span>
    </div>
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
